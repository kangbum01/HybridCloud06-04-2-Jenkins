---
- name: "Step 1: Jenkins 노드 기본 세팅 (Docker 준비)"
  hosts: jenkins
  become: true

  tasks:
    ################################################################
    # 1-0. Podman 비활성화 (Docker 충돌 방지)
    ################################################################
    - name: "1-0-1. Podman 서비스 정지 및 마스킹"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - podman.socket
        - podman.service
      ignore_errors: true

    - name: "1-0-2. podman-docker 패키지 제거"
      ansible.builtin.package:
        name: podman-docker
        state: absent
      ignore_errors: true

    ################################################################
    # 1-1. Docker 엔진 설치
    ################################################################
    - name: "1-1-1. yum-utils 설치"
      ansible.builtin.package:
        name: yum-utils
        state: present

    - name: "1-1-2. Docker 공식 리포지토리 추가"
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/centos/docker-ce.repo
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: '0644'

    - name: "1-1-3. Docker CE 및 필수 패키지 설치"
      ansible.builtin.package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - python3-pip
        state: present

    - name: "1-1-4. Docker 서비스 시작 및 활성화"
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: "1-1-5. Python Docker SDK 설치"
      ansible.builtin.pip:
        name: docker
        state: present
    
    # unixsocket : http+docker:// 스킴을 처리하는 어댑터
    - name: "1-1-6. Docker SDK + unixsocket 의존성 설치"
      ansible.builtin.pip:
        name:
          - docker
          - requests
          - requests-unixsocket
          - urllib3
        state: present
        executable: pip3


####################################################################
# Step 2: Jenkins 설치 (커스텀 이미지 + CasC)
####################################################################
- name: "Step 2: Jenkins 설치"
  hosts: jenkins
  become: true
  roles:
    - jenkins_setup
