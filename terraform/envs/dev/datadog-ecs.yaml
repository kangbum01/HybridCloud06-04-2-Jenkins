AWSTemplateFormatVersion: "2010-09-09"
Description: "Beat-dev ECS Fargate + Datadog Agent + FireLens (secure & reusable)"

Parameters:
  ClusterName:
    Type: String
    Description: "Existing ECS Cluster name or ARN"

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AssignPublicIp:
    Type: String
    AllowedValues: ["ENABLED", "DISABLED"]
    Default: "DISABLED"

  DesiredCount:
    Type: Number
    Default: 1

  AppImage:
    Type: String
    Description: "ECR image URI for beat-dev-web"

  AppContainerPort:
    Type: Number
    Default: 80

  DatadogSite:
    Type: String
    Default: "ap1.datadoghq.com"

  DatadogApiKeySecretArn:
    Type: String
    Description: "Secrets Manager ARN that stores Datadog API key"

  FirelensLogGroupName:
    Type: String
    Default: "/ecs/beat-dev-firelens"

Resources:
  FirelensLogGroup:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName: !Ref FirelensLogGroupName
      RetentionInDays: 14

  DatadogTaskRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "datadog-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: ["ecs-tasks.amazonaws.com"]
            Action: ["sts:AssumeRole"]
      Policies:
        - PolicyName: "datadog-task-role-minimum"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # (선택) 필요 시만 남겨. 보통 Fargate agent는 ECS metadata로도 충분한 경우가 많아.
              - Effect: "Allow"
                Action:
                  - "ecs:ListClusters"
                  - "ecs:DescribeTasks"
                  - "ecs:ListTasks"
                Resource: "*"

  DatadogTaskExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "datadog-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: ["ecs-tasks.amazonaws.com"]
            Action: ["sts:AssumeRole"]
      ManagedPolicyArns:
        # ECR pull + CloudWatch logs 등 실행에 필요한 표준 권한
        - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: "datadog-secret-access"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: ["secretsmanager:GetSecretValue"]
                Resource: [!Ref DatadogApiKeySecretArn]

  ECSTaskDefinition:
    Type: "AWS::ECS::TaskDefinition"
    Properties:
      Family: "beat-dev-web-with-datadog"
      NetworkMode: "awsvpc"
      RequiresCompatibilities: ["FARGATE"]
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt DatadogTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt DatadogTaskRole.Arn

      ContainerDefinitions:
        - Name: "datadog-agent"
          Image: "public.ecr.aws/datadog/agent:latest"
          Essential: false
          Environment:
            - Name: "DD_SITE"
              Value: !Ref DatadogSite
            - Name: "ECS_FARGATE"
              Value: "true"
            - Name: "DD_APM_ENABLED"
              Value: "false"
          Secrets:
            - Name: "DD_API_KEY"
              ValueFrom: !Ref DatadogApiKeySecretArn

        - Name: "datadog-log-router"
          Image: "public.ecr.aws/aws-observability/aws-for-fluent-bit:stable"
          Essential: true
          FirelensConfiguration:
            Type: "fluentbit"
            Options:
              enable-ecs-log-metadata: "true"
          LogConfiguration:
            LogDriver: "awslogs"
            Options:
              awslogs-group: !Ref FirelensLogGroupName
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: "firelens"

        - Name: "beat-dev-web"
          Image: !Ref AppImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppContainerPort
              Protocol: "tcp"
          DependsOn:
            - ContainerName: "datadog-log-router"
              Condition: "START"
          LogConfiguration:
            LogDriver: "awsfirelens"
            Options:
              Name: "datadog"
              Host: !Sub "http-intake.logs.${DatadogSite}"
              TLS: "on"
              provider: "ecs"
              dd_service: "beat-dev-web"
              dd_source: "ecs"
              dd_tags: "env:dev,project:beat"
            SecretOptions:
              - Name: "apikey"
                ValueFrom: !Ref DatadogApiKeySecretArn

  ECSService:
    Type: "AWS::ECS::Service"
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref ECSTaskDefinition
      LaunchType: "FARGATE"
      DesiredCount: !Ref DesiredCount
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref SecurityGroupId]
          AssignPublicIp: !Ref AssignPublicIp